[package]
name = "simbiose7-cli"
version = "0.4.102"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "dbx"
path = "src/main.rs"

[dependencies]
simbiose7-core = { path = "../simbiose7-core", default-features = false, features = ["sqlite-bundled"] }
simbiose7-mcp = { path = "../simbiose7-mcp" }
dirs = "6"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[dev-dependencies]
async-trait = "0.1"
